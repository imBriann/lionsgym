spring.application.name=webApp

# Configuración de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/lionsgymBD
spring.datasource.username=postgres
spring.datasource.password=postgres

# Dialecto y driver de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# Para que cree automáticamente las tablas
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en consola (opcional para debug)
spring.jpa.show-sql=true

# Configuración para fechas JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Para debugging - muestra las consultas SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
