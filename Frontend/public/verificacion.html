<!DOCTYPE html>
<html lang="es-co">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion's Gym</title>
    <link href="../resources/css/verificacion.css" rel="stylesheet" />
    <link rel="preload" href="../resources/css/verificacion.css" as="style" />
    <link rel="stylesheet" href="../resources/css/login.css" />
    <link rel="preload" href="../resources/css/login.css" as="style" />
    <link rel="stylesheet" href="../resources/css/base.css" />
    <link rel="preload" href="../resources/css/base.css" as="style" />
    <link rel="preload" href="https://storage.googleapis.com/lionsgym.online/resources/css/normalize.css" as="style" />
    <link href="https://storage.googleapis.com/lionsgym.online/resources/css/normalize.css" rel="stylesheet" />
    <link rel="icon" href="https://storage.googleapis.com/lionsgym.online/resources/img/logoGym.png"
        type="image/x-icon" />
    <link rel="shortcut icon" href="https://storage.googleapis.com/lionsgym.online/resources/img/logoGym.png"
        type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header id="inicio" class="barra-nav">
        <a href="/"><img class="logo"
                src="https://storage.googleapis.com/lionsgym.online/resources/img/logoGym.png" alt="LionsGym"></a>
        <nav>
            <div>
                <div class="menu-btn" id="menu-btn">
                    <label class="hamburger">
                        <input type="checkbox" id="menu-toggle">
                        <svg viewBox="0 0 32 32">
                            <path class="line line-top-bottom"
                                d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22">
                            </path>
                            <path class="line" d="M7 16 27 16"></path>
                        </svg>
                    </label>
                </div>

                <div class="nav-links" id="nav-links">
                    <a href="/" id="inicio-link">Inicio</a>
                    <a href="/clases">Clases</a>
                    <a href="/sedes">Sedes</a>
                    <a href="/promociones">Promociones</a>
                    <a href="/register"><button class="botonIngresar">Inscríbete</button></a>
                </div>
            </div>
        </nav>
    </header>

    <!-- From Uiverse.io by Yaya12085 -->
    <div class="login-wrapper" style="display:flex;align-items:center;justify-content:center;min-height:100vh; margin-top:-6rem;">
        <div class="form-wrapper" style="width:100%;display:flex;align-items:center;justify-content:center;">
            <div class="form-container" style="width: 30rem; margin:auto; display:flex; flex-direction:column; align-items:center;">
                <h2 style="text-align:center;">Verificación de número</h2>
                <div id="numeroCensurado" style="margin-bottom:1.2em;text-align:center;"></div>
                <button class="botonIngresar" id="continuarBtn" type="button" style="margin-bottom:1.5em;">Enviar código por WhatsApp</button>
                <div id="codigoSection" style="display:none;">
                    <p style="margin-bottom:0.5em;text-align:center;">Ingresa el código de 6 dígitos que enviamos a tu WhatsApp:</p>
                    <div id="timer" style="margin-bottom:0.7em;text-align:center;"></div>
                    <div class="code-inputs" id="inputsContainer" style="justify-content:center;"></div>
                    <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
                        <button class="botonIngresar" id="verificarBtn" type="button" style="margin-top:1.2em; width:70%; max-width:220px;">Verificar</button>
                        <button id="reenviarBtn" type="button" disabled style="margin-top:0.5em; width:70%; max-width:220px;">Reenviar código</button>
                    </div>
                </div>
                <div id="mensaje" style="text-align:center;"></div>
                <div class="verificacion-ayuda" id="ayudaSoporte" style="display:none;text-align:center;">
                    <p style="margin-top:1em;font-size:0.97em;color:#555;">
                        ¿No recibiste el código? Si tienes problemas, <a href="mailto:soporte@lionsgym.online" style="color:#fbbf24;">contáctanos</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="../resources/js/barNav.js"></script>
    <script src="../resources/js/verificacion.js"></script>
</body>

</html>
