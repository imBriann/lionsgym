<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Verificación vía WhatsApp</title>
</head>

<body>
  <h2>Verifica tu número</h2>
  <input type="text" id="numero" placeholder="Número con indicativo (ej: 573001234567)">
  <button onclick="enviarCodigo()">Enviar Código</button>

  <script>
    function enviarCodigo() {
      const numero = document.getElementById('numero').value;
      if (!numero.startsWith("57")) {
        alert("El número debe empezar con el indicativo '57'");
        return;
      }

      fetch("https://whatsappverificacion.onrender.com/send-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: numero })
      })

        .then(res => res.json())
        .then(data => {
          if (data.message) {
            alert(data.message);
          } else if (data.error) {
            alert("Error: " + data.error);
          }
        })
        .catch(err => alert("Error: " + err));
    }

  </script>

</body>

</html>
