    <!-- From Uiverse.io by Yaya12085 -->
    <div class="login-wrapper">
        <div class="form-container">
            <p class="title">Registro de Usuario</p>
            <form class="form">
                <div class="row">
                    <div class="col-12 col-md-6">
                        <div class="input-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" name="nombre" id="nombre" placeholder="Tu nombre" required>
                        </div>
                        <div class="input-group">
                            <label for="apellido">Apellido</label>
                            <input type="text" name="apellido" id="apellido" placeholder="Tu apellido" required>
                        </div>
                        <div class="input-group">
                            <label for="email">Correo</label>
                            <input type="email" name="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="input-group">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" name="telefono" id="telefono" placeholder="Ej: 3001234567" pattern="[0-9]{10}" required>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="input-group">
                            <label for="fecha_nacimiento">Fecha de nacimiento</label>
                            <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" required>
                        </div>
                        <div class="input-group">
                            <label for="genero">Género</label>
                            <select name="genero" id="genero" required>
                                <option value="">Selecciona una opción</option>
                                <option value="masculino">Masculino</option>
                                <option value="femenino">Femenino</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="password">Contraseña</label>
                            <div style="position:relative;">
                                <input type="password" name="password" id="password" placeholder="Contraseña" style="padding-right:2.5rem;" required>
                                <button type="button" id="togglePassword" aria-label="Mostrar/Ocultar contraseña"
                                    style="position:absolute;top:50%;right:0.75rem;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;">
                                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24">
                                        <path id="eyeOpen" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12zm11 3a3 3 0 100-6 3 3 0 000 6z" fill="#9ca3af"/>
                                        <path id="eyeSlash" style="display:none;" d="M2 2l20 20M17.94 17.94C16.12 19.25 13.99 20 12 20c-7 0-11-8-11-8a21.77 21.77 0 014.06-5.94M9.53 9.53A3 3 0 0114.47 14.47" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="confirm_password">Confirmar contraseña</label>
                            <div style="position:relative;">
                                <input type="password" name="confirm_password" id="confirm_password" placeholder="Repite la contraseña" style="padding-right:2.5rem;" required>
                                <button type="button" id="toggleConfirmPassword" aria-label="Mostrar/Ocultar contraseña"
                                    style="position:absolute;top:50%;right:0.75rem;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;">
                                    <svg id="eyeIconConfirm" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24">
                                        <path id="eyeOpenConfirm" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12zm11 3a3 3 0 100-6 3 3 0 000 6z" fill="#9ca3af"/>
                                        <path id="eyeSlashConfirm" style="display:none;" d="M2 2l20 20M17.94 17.94C16.12 19.25 13.99 20 12 20c-7 0-11-8-11-8a21.77 21.77 0 014.06-5.94M9.53 9.53A3 3 0 0114.47 14.47" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="sign" type="submit">Registrarse</button>
            </form>
            <div class="signup">
                ¿Ya tienes una cuenta?
                <a rel="noopener noreferrer" href="login.html">Inicia sesión</a>
            </div>
