    <!-- From Uiverse.io by Yaya12085 -->
    <!-- SECCIÓN DE LOGIN ELIMINADA -->
    <!-- Solo queda la sección de restablecimiento de contraseña -->
    <div class="login-wrapper">
        <div class="form-container">
            <p class="title">Restablecer Contraseña</p>
            <!-- Paso 1: Solicitar correo -->
            <form class="form" id="requestEmailForm">
                <div class="input-group" style="margin-bottom: 3rem;">
                    <label for="resetEmail">Correo</label>
                    <input type="email" name="resetEmail" id="resetEmail" required>
                </div>
                <button class="sign" type="submit">Enviar código</button>
            </form>
            <!-- Paso 2: Ingresar código (inicialmente oculto) -->
            <div id="codeSection" style="display:none; margin-top: 2rem;">
                <p>Hemos enviado un código a <span id="censoredEmail"></span></p>
                <div class="input-group" style="margin-bottom: 3rem;">
                    <label for="resetCode">Código</label>
                    <input type="text" name="resetCode" id="resetCode" maxlength="6" required>
                </div>
                <button class="sign" id="verifyCodeBtn">Verificar código</button>
            </div>

            <form class="form" id="resetPasswordForm" style="display:none; margin-top: 2rem;">
                <p>Código verificado. Ahora puedes crear tu nueva contraseña.</p>
                <div class="input-group">
                    <label for="newPassword">Nueva Contraseña</label>
                    <input type="password" name="newPassword" id="newPassword" required>
                </div>
                <div class="input-group" style="margin-bottom: 3rem;">
                    <label for="confirmNewPassword">Confirmar Nueva Contraseña</label>
                    <input type="password" name="confirmNewPassword" id="confirmNewPassword" required>
                </div>
                <button class="sign" type="submit">Cambiar contraseña</button>
            </form>

            <div id="resetMessage" style="text-align:center; margin-top: 1rem;"></div>
        </div>
    </div>

    <script src="../resources/js/login.js"></script>
    <script src="../resources/js/barNav.js"></script>
    <script src="../resources/js/aviso.js"></script>
    <script src="../resources/js/reset-password.js"></script>
